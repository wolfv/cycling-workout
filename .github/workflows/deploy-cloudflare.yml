name: Deploy to Cloudflare Workers

# Manual trigger only for now. The switch from GitHub Pages happens in a later step (see docs/PLAN-konten-und-verlauf.md, stage 7).
on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Run regression tests (frontend)
        run: node --test tests/*.test.cjs

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run Worker tests
        working-directory: worker
        run: npm test

      - name: Build static assets
        working-directory: worker
        env:
          GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Apply D1 migrations (production)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Deploy Worker (production)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --var APP_VERSION:${GITHUB_SHA::7}
